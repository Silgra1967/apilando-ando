<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apliando Ando — Prototipo Interactivo</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Confetti library para micro-celebraciones -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              sage: '#8FA89B',
              terracotta: '#D97D64',
              lavender: '#A89BB9',
              sand: '#D6C7A1',
              cream: '#FAF7F2',
              dark: '#2D312E',
              muted: '#6E746E'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF7F2;
      color: #2D312E;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex justify-center min-h-screen p-0 sm:p-4">

  <!-- Mobile Frame Container -->
  <div class="w-full max-w-md bg-white sm:rounded-3xl shadow-xl overflow-hidden flex flex-col min-h-screen sm:min-h-[840px] relative border border-[#EBE5DC]">
    
    <!-- Top Status Simulation -->
    <div class="px-6 pt-3 pb-2 flex justify-between items-center text-xs text-brand-muted font-medium select-none bg-white border-b border-gray-50">
      <span id="topClock">9:41</span>
      <span class="flex items-center gap-1.5">
        <span class="text-[10px] bg-brand-sage/20 text-brand-dark px-2 py-0.5 rounded-full font-semibold">Prototipo</span>
        <span>100%</span>
      </span>
    </div>

    <!-- MAIN VIEW AREA -->
    <div id="appContainer" class="flex-1 flex flex-col p-6 overflow-y-auto">
      <!-- Se inyecta dinámicamente con JS -->
    </div>

  </div>

  <script>
    // --- ESTADO LOCAL DEL PROTOTIPO ---
    const state = {
      currentView: 'onboarding-1', // onboarding-1..5, 'dashboard', 'detail'
      selectedHabitForDetail: null,
      onboarding: {
        habitName: '',
        color: '#8FA89B',
        anchorText: '',
        reminderTime: '20:00',
        revelationStep: 1
      },
      routine: {
        anchorGeneral: 'Después del café mañanero',
        graduatedAnchors: [
          { 
            id: '1', 
            name: 'Caminar 20 minutos', 
            streak: 287, 
            bestStreak: 287,
            totalDays: 287,
            shields: 3,
            color: '#8FA89B',
            anchor: 'Al terminar el café',
            status: 'anchor',
            stickers: ['🌱 Primer Paso', '🛡️ Resiliencia', '🔥 Hábito 21d', '🌟 100 Días', '🌳 Graduación 6m']
          }
        ],
        maintenanceHabits: [
          { 
            id: '2', 
            name: 'Lectura atenta (10 min)', 
            streak: 45, 
            bestStreak: 45,
            totalDays: 45,
            shields: 2,
            color: '#A89BB9', 
            anchor: 'Con el mate de la tarde',
            status: 'maintenance',
            completedToday: true,
            stickers: ['🌱 Primer Paso', '🛡️ Resiliencia', '🔥 Hábito 21d', '🌿 Mantenimiento']
          }
        ],
        activeHabit: {
          id: '3',
          name: 'Respiración consciente',
          anchor: 'Antes de acostarme',
          streak: 14,
          bestStreak: 14,
          totalDays: 14,
          shields: 2,
          dayTarget: 21,
          completedToday: false,
          color: '#D97D64',
          status: 'active',
          stickers: ['🌱 Primer Paso', '🛡️ Resiliencia']
        }
      },
      showShieldModal: false
    };

    const colors = [
      { name: 'Salvia', hex: '#8FA89B' },
      { name: 'Terracota', hex: '#D97D64' },
      { name: 'Lavanda', hex: '#A89BB9' },
      { name: 'Arena', hex: '#D6C7A1' }
    ];

    // --- RENDER PRINCIPAL ---
    function render() {
      const container = document.getElementById('appContainer');
      container.innerHTML = '';

      if (state.currentView.startsWith('onboarding-')) {
        renderOnboarding(container);
      } else if (state.currentView === 'dashboard') {
        renderDashboard(container);
      } else if (state.currentView === 'detail') {
        renderDetailView(container);
      }
    }

    // --- FLUJO DE ONBOARDING ---
    function renderOnboarding(container) {
      const step = state.currentView;

      if (step === 'onboarding-1') {
        container.innerHTML = `
          <div class="flex-1 flex flex-col justify-between py-8 fade-in">
            <div class="mt-12 text-center">
              <span class="text-4xl mb-4 block">🌱</span>
              <h1 class="text-2xl font-bold tracking-tight text-brand-dark mb-4">Apliando Ando</h1>
              <p class="text-base text-brand-muted leading-relaxed px-4">
                Los hábitos no se construyen de golpe.<br>
                Se construyen de a uno, despacio, sin prisa.<br><br>
                <strong class="text-brand-dark font-medium">Acá vas a empezar por el primero.</strong>
              </p>
            </div>
            <button onclick="goToView('onboarding-2')" class="w-full bg-brand-dark text-white font-medium py-4 rounded-2xl shadow-sm hover:opacity-95 transition-all">
              Empezar
            </button>
          </div>
        `;
      } else if (step === 'onboarding-2') {
        container.innerHTML = `
          <div class="flex-1 flex flex-col justify-between py-4 fade-in">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-brand-muted">Paso 1 de 4</span>
              <h2 class="text-2xl font-bold text-brand-dark mt-2 mb-2">¿Qué hábito querés empezar a construir?</h2>
              <p class="text-sm text-brand-muted mb-6">Elegí una acción pequeña y posible de hacer todos los días.</p>

              <input 
                id="habitInput" 
                type="text" 
                placeholder="Ej. Leer 10 minutos, Tomar agua..." 
                value="${state.onboarding.habitName}"
                class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-sage text-base mb-4"
                oninput="state.onboarding.habitName = this.value"
              />

              <div class="flex flex-wrap gap-2 mb-6">
                ${['Leer 10 min', 'Caminar 15 min', 'Beber agua al despertar', 'Meditar 5 min'].map(s => `
                  <button onclick="selectSuggestion('${s}')" class="text-xs bg-gray-100 hover:bg-gray-200 text-brand-dark px-3 py-1.5 rounded-full transition-all">
                    ${s}
                  </button>
                `).join('')}
              </div>

              <label class="block text-xs font-bold text-brand-muted uppercase mb-3">Color identificatorio</label>
              <div class="flex gap-3">
                ${colors.map(c => `
                  <button 
                    onclick="selectColor('${c.hex}')" 
                    class="w-10 h-10 rounded-full flex items-center justify-center transition-all ${state.onboarding.color === c.hex ? 'ring-2 ring-offset-2 ring-brand-dark scale-105' : 'opacity-70 hover:opacity-100'}"
                    style="background-color: ${c.hex};"
                  >
                    ${state.onboarding.color === c.hex ? '✓' : ''}
                  </button>
                `).join('')}
              </div>
            </div>

            <button 
              onclick="saveStep2()" 
              class="w-full bg-brand-dark text-white font-medium py-4 rounded-2xl shadow-sm hover:opacity-95 transition-all mt-6"
            >
              Este es
            </button>
          </div>
        `;
      } else if (step === 'onboarding-3') {
        container.innerHTML = `
          <div class="flex-1 flex flex-col justify-between py-4 fade-in">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-brand-muted">Paso 2 de 4</span>
              <h2 class="text-2xl font-bold text-brand-dark mt-2 mb-2">¿A qué momento de tu día lo podés enganchar?</h2>
              <p class="text-sm text-brand-muted mb-6">Los hábitos nuevos se instalan mejor cuando los atás a algo que ya hacés en automático.</p>

              <input 
                id="anchorInput" 
                type="text" 
                placeholder="Ej. Después del café, al llegar a casa..." 
                value="${state.onboarding.anchorText}"
                class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-sage text-base mb-4"
                oninput="state.onboarding.anchorText = this.value"
              />

              <div class="flex flex-wrap gap-2 mb-6">
                ${['Después del desayuno', 'Con el mate de la mañana', 'Antes de dormir', 'Al volver del trabajo'].map(a => `
                  <button onclick="selectAnchor('${a}')" class="text-xs bg-gray-100 hover:bg-gray-200 text-brand-dark px-3 py-1.5 rounded-full transition-all">
                    ${a}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="flex flex-col gap-3">
              <button onclick="goToView('onboarding-4')" class="w-full bg-brand-dark text-white font-medium py-4 rounded-2xl shadow-sm hover:opacity-95 transition-all">
                Perfecto
              </button>
              <button onclick="skipAnchor()" class="w-full text-xs text-brand-muted hover:text-brand-dark py-2 font-medium">
                Prefiero no anclar por ahora
              </button>
            </div>
          </div>
        `;
      } else if (step === 'onboarding-4') {
        container.innerHTML = `
          <div class="flex-1 flex flex-col justify-between py-4 fade-in">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-brand-muted">Paso 3 de 4</span>
              <h2 class="text-2xl font-bold text-brand-dark mt-2 mb-2">¿A qué hora querés que te recordemos?</h2>
              <p class="text-sm text-brand-muted mb-6">Una notificación simple para cerrar tu día con tranquilidad. Cero spam.</p>

              <div class="flex items-center justify-center py-10">
                <input 
                  type="time" 
                  value="${state.onboarding.reminderTime}" 
                  onchange="state.onboarding.reminderTime = this.value"
                  class="text-4xl font-bold text-brand-dark bg-gray-50 border border-gray-200 rounded-2xl px-6 py-4 focus:outline-none focus:ring-2 focus:ring-brand-sage"
                />
              </div>
            </div>

            <button onclick="goToView('onboarding-5')" class="w-full bg-brand-dark text-white font-medium py-4 rounded-2xl shadow-sm hover:opacity-95 transition-all">
              Listo
            </button>
          </div>
        `;
      } else if (step === 'onboarding-5') {
        renderRevelationCards(container);
      }
    }

    function renderRevelationCards(container) {
      const cardIdx = state.onboarding.revelationStep;
      const habitName = state.onboarding.habitName || 'tu hábito';

      let content = '';

      if (cardIdx === 1) {
        content = `
          <div class="flex-1 flex flex-col justify-between py-4 fade-in">
            <div class="my-auto text-center px-4">
              <span class="text-5xl mb-6 block">🌱</span>
              <span class="text-xs font-bold uppercase tracking-wider text-brand-sage">Regla 1 de 3</span>
              <h2 class="text-2xl font-bold text-brand-dark mt-2 mb-4">Un hábito a la vez</h2>
              <p class="text-base text-brand-muted leading-relaxed">
                Esta app solo te deja tener <strong>un hábito activo a la vez</strong>. No es un límite: es para asegurar que <strong>${habitName}</strong> realmente se vuelva parte de tu vida antes de sumar otra cosa.
              </p>
            </div>
            <button onclick="nextRevelation(2)" class="w-full bg-brand-dark text-white font-medium py-4 rounded-2xl shadow-sm hover:opacity-95 transition-all">
              Entendido
            </button>
          </div>
        `;
      } else if (cardIdx === 2) {
        content = `
          <div class="flex-1 flex flex-col justify-between py-4 fade-in">
            <div class="my-auto text-center px-4">
              <span class="text-5xl mb-6 block">🛡️</span>
              <span class="text-xs font-bold uppercase tracking-wider text-brand-sage">Regla 2 de 3</span>
              <h2 class="text-2xl font-bold text-brand-dark mt-2 mb-4">Tus escudos de protección</h2>
              <p class="text-base text-brand-muted leading-relaxed">
                Empezás con <strong>2 escudos</strong>. Si un día no podés, la racha no se rompe: al día siguiente decidís conscientemente si usar tu escudo. La constancia importa más que la perfección.
              </p>
            </div>
            <button onclick="nextRevelation(3)" class="w-full bg-brand-dark text-white font-medium py-4 rounded-2xl shadow-sm hover:opacity-95 transition-all">
              Siguiente
            </button>
          </div>
        `;
      } else if (cardIdx === 3) {
        content = `
          <div class="flex-1 flex flex-col justify-between py-4 fade-in">
            <div class="my-auto text-center px-4">
              <span class="text-5xl mb-6 block">📅</span>
              <span class="text-xs font-bold uppercase tracking-wider text-brand-sage">Regla 3 de 3</span>
              <h2 class="text-2xl font-bold text-brand-dark mt-2 mb-4">La meta de 21 días</h2>
              <p class="text-base text-brand-muted leading-relaxed">
                Cuando llegues a los <strong>21 días cumplidos</strong> con ${habitName}, recién ahí abriremos la puerta para sumar tu siguiente hábito. Hasta entonces, este es tu único foco.
              </p>
            </div>
            <button onclick="finishOnboarding()" class="w-full bg-brand-sage text-white font-bold py-4 rounded-2xl shadow-sm hover:opacity-95 transition-all">
              ¡Empecemos!
            </button>
          </div>
        `;
      }

      container.innerHTML = content;
    }

    // --- DASHBOARD: "MI DÍA" ---
    function renderDashboard(container) {
      const r = state.routine;
      const active = r.activeHabit;
      const maintenance = r.maintenanceHabits;
      const graduated = r.graduatedAnchors;

      container.innerHTML = `
        <div class="flex-1 flex flex-col fade-in">
          
          <!-- Encabezado -->
          <div class="flex justify-between items-start mb-6">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-brand-muted">Martes, 17 de noviembre</span>
              <h1 class="text-xl font-bold text-brand-dark">Mi Día</h1>
            </div>
            <button onclick="toggleShieldModal()" title="Simular confirmación de escudo" class="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-2.5 py-1.5 rounded-xl font-medium">
              Simular Escudo 🛡️
            </button>
          </div>

          <!-- Barra sutil de estado diario -->
          <div class="bg-gray-100 rounded-2xl p-3 mb-6 flex items-center justify-between text-xs text-brand-muted font-medium">
            <span>Progreso de hoy</span>
            <span class="font-bold text-brand-dark">${(maintenance.filter(m => m.completedToday).length + (active.completedToday ? 1 : 0))} de ${maintenance.length + 1} completados</span>
          </div>

          <!-- Cadena de Rutina (Habit Stacking) -->
          <div class="space-y-4">
            
            <!-- 1. Ancla Externa -->
            <div class="flex items-center gap-3 px-2 py-1">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-900">🌳 ANCLA</span>
              <span class="text-xs font-medium text-brand-muted">${r.anchorGeneral}</span>
            </div>

            <div class="border-l-2 border-dashed border-gray-200 ml-5 pl-4 space-y-4">

              <!-- 2. Ancla Graduada (6 meses) -->
              ${graduated.map(g => `
                <div onclick="openDetail('${g.id}')" class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm opacity-90 cursor-pointer hover:border-brand-sage transition-all">
                  <div class="flex justify-between items-center text-xs">
                    <span class="font-bold text-brand-sage uppercase text-[10px]">🌳 Hábito Graduado</span>
                    <span class="text-brand-muted font-medium">✦ ${g.streak} días racha</span>
                  </div>
                  <div class="text-sm font-semibold text-brand-dark mt-1 flex justify-between items-center">
                    <span>${g.name}</span>
                    <span class="text-xs text-brand-muted">Ver camino →</span>
                  </div>
                  <div class="text-[11px] text-brand-muted mt-0.5">Ya es parte natural de vos</div>
                </div>
              `).join('')}

              <!-- 3. Hábito en Mantenimiento -->
              ${maintenance.map(m => `
                <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm flex items-center justify-between gap-3 hover:border-brand-lavender transition-all">
                  <div onclick="openDetail('${m.id}')" class="flex-1 cursor-pointer">
                    <div class="text-[10px] font-bold text-brand-lavender uppercase tracking-wider">🌿 Mantenimiento</div>
                    <div class="text-sm font-bold text-brand-dark mt-0.5">${m.name}</div>
                    <div class="text-xs text-brand-muted flex items-center gap-2 mt-1">
                      <span>🔥 ${m.streak} días</span>
                      <span>·</span>
                      <span class="text-brand-sage font-medium">Ver camino →</span>
                    </div>
                  </div>
                  <button 
                    onclick="toggleMaintenance('${m.id}')"
                    class="w-10 h-10 rounded-2xl border flex items-center justify-center text-base transition-all shrink-0 ${m.completedToday ? 'bg-brand-sage text-white border-brand-sage' : 'border-gray-300 hover:border-brand-sage'}"
                  >
                    ${m.completedToday ? '✓' : ''}
                  </button>
                </div>
              `).join('')}

              <!-- 4. Hábito Activo (El protagonista) -->
              <div class="bg-white border-2 border-brand-terracotta/40 rounded-3xl p-5 shadow-md relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                  <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-brand-terracotta/15 text-brand-terracotta uppercase tracking-wider">
                    🌱 En Construcción (Activo)
                  </span>
                  <div class="flex items-center gap-1 text-xs">
                    <span title="Escudos disponibles" class="flex gap-0.5">
                      ${'🛡️'.repeat(active.shields)}${'⚪'.repeat(3 - active.shields)}
                    </span>
                  </div>
                </div>

                <!-- Clic en título abre detalle -->
                <div onclick="openDetail('${active.id}')" class="cursor-pointer mb-4 group">
                  <div class="text-base font-bold text-brand-dark flex items-center justify-between">
                    <span>${active.name}</span>
                    <span class="text-xs font-semibold text-brand-terracotta opacity-80 group-hover:opacity-100">Ver camino & logros →</span>
                  </div>
                  <div class="text-xs text-brand-muted mt-0.5">↳ ${active.anchor}</div>
                </div>

                <!-- Barra de camino al hito (21 días) -->
                <div class="space-y-1 mb-4">
                  <div class="flex justify-between text-[11px] font-medium text-brand-muted">
                    <span>Día ${active.streak} de ${active.dayTarget} para consolidar</span>
                    <span>${Math.round((active.streak / active.dayTarget) * 100)}%</span>
                  </div>
                  <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                    <div class="bg-brand-terracotta h-full rounded-full transition-all duration-500" style="width: ${(active.streak / active.dayTarget) * 100}%"></div>
                  </div>
                </div>

                <!-- Checkbox principal de tildado -->
                <button 
                  onclick="toggleActiveHabit()" 
                  class="w-full py-3.5 rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${active.completedToday ? 'bg-brand-sage text-white' : 'bg-brand-dark text-white hover:opacity-95'}"
                >
                  ${active.completedToday ? '<span>✓ Cumplido por hoy</span>' : '<span>Marcar como hecho</span>'}
                </button>
              </div>

            </div>

          </div>

          <!-- Mensaje al completar todo -->
          ${(active.completedToday && maintenance.every(m => m.completedToday)) ? `
            <div class="mt-6 p-4 rounded-2xl bg-brand-sage/15 text-center text-xs text-brand-dark font-medium fade-in">
              ✨ Rutina completa por hoy. Gran constancia, buen descanso.
            </div>
          ` : ''}

        </div>

        <!-- MODAL DE CONFIRMACIÓN DE ESCUDO -->
        ${state.showShieldModal ? `
          <div class="absolute inset-0 bg-black/40 flex items-end justify-center z-50 fade-in">
            <div class="bg-white w-full rounded-t-3xl p-6 shadow-2xl">
              <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mb-4"></div>
              <div class="text-center mb-4">
                <span class="text-4xl block mb-2">🛡️</span>
                <h3 class="text-lg font-bold text-brand-dark">A veces la vida se interpone</h3>
                <p class="text-xs text-brand-muted mt-1 px-4 leading-relaxed">
                  Ayer no registraste <strong>${active.name}</strong>.<br>
                  ¿Querés activar un escudo para cuidar tu racha de ${active.streak} días?
                </p>
              </div>

              <div class="bg-gray-50 rounded-2xl p-3 text-xs text-brand-muted flex justify-between items-center mb-5">
                <span>Escudos restantes si lo usás:</span>
                <span class="font-bold text-brand-dark">${active.shields - 1} de 3</span>
              </div>

              <div class="flex flex-col gap-2">
                <button onclick="confirmShield(true)" class="w-full bg-brand-dark text-white font-medium py-3.5 rounded-2xl text-sm">
                  Sí, usar escudo 🛡️
                </button>
                <button onclick="confirmShield(false)" class="w-full text-xs text-brand-muted hover:text-brand-dark py-2 font-medium">
                  No, empezar racha de nuevo
                </button>
              </div>
            </div>
          </div>
        ` : ''}
      `;
    }

    // --- NUEVA PANTALLA: "MI CAMINO Y LOGROS" (DETALLE + CALENDARIO) ---
    function renderDetailView(container) {
      const h = state.selectedHabitForDetail;
      if (!h) {
        goToView('dashboard');
        return;
      }

      // Generar 30 días simulados de calendario
      // Días 1..12: completados (✅), Día 13: escudo (🛡️), Día 14: hoy
      const days = [];
      for (let i = 1; i <= 30; i++) {
        let type = 'empty';
        if (i < 13) type = 'done';
        else if (i === 13) type = 'shield';
        else if (i === 14) type = h.completedToday ? 'done' : 'current';
        days.push({ num: i, type });
      }

      container.innerHTML = `
        <div class="flex-1 flex flex-col fade-in">
          
          <!-- Barra superior de navegación -->
          <div class="flex items-center justify-between mb-5">
            <button onclick="goToView('dashboard')" class="text-xs font-semibold text-brand-muted hover:text-brand-dark flex items-center gap-1 py-1">
              ← Volver a Mi Día
            </button>
            <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${h.status === 'active' ? 'bg-brand-terracotta/20 text-brand-terracotta' : h.status === 'maintenance' ? 'bg-brand-lavender/20 text-brand-lavender' : 'bg-brand-sage/20 text-brand-sage'}">
              ${h.status === 'active' ? '🌱 Activo' : h.status === 'maintenance' ? '🌿 Mantenimiento' : '🌳 Graduado'}
            </span>
          </div>

          <!-- Cabecera del hábito -->
          <div class="mb-5">
            <h1 class="text-2xl font-bold text-brand-dark">${h.name}</h1>
            <p class="text-xs text-brand-muted mt-1">↳ ${h.anchor || 'Sin ancla'}</p>
          </div>

          <!-- Métricas clave en tarjetas -->
          <div class="grid grid-cols-3 gap-2.5 mb-6">
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-3 text-center">
              <span class="text-[10px] uppercase font-bold text-brand-muted block">Racha actual</span>
              <span class="text-lg font-black text-brand-dark mt-1 block">🔥 ${h.streak}d</span>
            </div>
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-3 text-center">
              <span class="text-[10px] uppercase font-bold text-brand-muted block">Récord</span>
              <span class="text-lg font-black text-brand-dark mt-1 block">🏆 ${h.bestStreak || h.streak}d</span>
            </div>
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-3 text-center">
              <span class="text-[10px] uppercase font-bold text-brand-muted block">Escudos</span>
              <span class="text-lg font-black text-brand-dark mt-1 block">🛡️ ${h.shields}/3</span>
            </div>
          </div>

          <!-- Calendario del Mes Minimalista -->
          <div class="bg-white border border-gray-200 rounded-3xl p-5 shadow-sm mb-6">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-xs font-bold text-brand-dark uppercase tracking-wider">Noviembre 2026</h3>
              <div class="flex gap-2 text-[10px] font-medium text-brand-muted">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-brand-sage"></span> Cumplido</span>
                <span class="flex items-center gap-1">🛡️ Escudo</span>
              </div>
            </div>

            <!-- Días de la semana -->
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-bold text-brand-muted mb-2">
              <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
            </div>

            <!-- Matriz de días -->
            <div class="grid grid-cols-7 gap-1.5 text-center">
              ${days.map(d => {
                let cellClasses = 'bg-gray-50 text-gray-400 border border-transparent';
                let indicator = '';

                if (d.type === 'done') {
                  // Fondo suave con número legible + tilde pequeña en esquina superior derecha
                  cellClasses = 'bg-brand-sage/20 text-brand-dark font-bold border border-brand-sage/40';
                  indicator = '<span class="absolute top-0.5 right-1 text-[8px] text-brand-sage font-black leading-none">✓</span>';
                } else if (d.type === 'shield') {
                  // Fondo ámbar con número visible + escudo pequeño
                  cellClasses = 'bg-amber-100/70 text-amber-950 font-bold border border-amber-300';
                  indicator = '<span class="absolute top-0.5 right-0.5 text-[8px] leading-none">🛡️</span>';
                } else if (d.type === 'current') {
                  // Día actual destacado
                  cellClasses = 'bg-white border-2 border-brand-terracotta text-brand-dark font-black';
                }

                return `
                  <div class="h-9 rounded-xl flex items-center justify-center text-xs relative transition-all ${cellClasses}">
                    <span>${d.num}</span>
                    ${indicator}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Colección de Stickers / Logros Desbloqueados -->
          <div class="bg-gray-50 border border-gray-100 rounded-3xl p-5 mb-4">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-xs font-bold text-brand-dark uppercase tracking-wider">Álbum de Logros</h3>
              <span class="text-[10px] text-brand-muted font-semibold">${h.stickers ? h.stickers.length : 0} ganados</span>
            </div>

            <div class="flex flex-wrap gap-2">
              ${(h.stickers && h.stickers.length > 0) ? h.stickers.map(st => `
                <div class="bg-white border border-gray-200 text-brand-dark px-3 py-2 rounded-2xl text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                  <span>${st}</span>
                </div>
              `).join('') : `
                <span class="text-xs text-brand-muted">Aún no hay logros. ¡Alcanzá el día 7 para desbloquear el primero!</span>
              `}
              
              <!-- Siguiente sticker bloqueado -->
              <div class="border border-dashed border-gray-300 px-3 py-2 rounded-2xl text-xs text-gray-400 font-medium flex items-center gap-1">
                <span>🔒 Próximo: 21 Días</span>
              </div>
            </div>
          </div>

        </div>
      `;
    }

    // --- ACCIONES INTERACTIVAS ---
    function goToView(viewName) {
      state.currentView = viewName;
      render();
    }

    function openDetail(habitId) {
      const all = [
        state.routine.activeHabit,
        ...state.routine.maintenanceHabits,
        ...state.routine.graduatedAnchors
      ];
      const found = all.find(item => item.id === habitId);
      if (found) {
        state.selectedHabitForDetail = found;
        state.currentView = 'detail';
        render();
      }
    }

    function selectSuggestion(name) {
      state.onboarding.habitName = name;
      render();
    }

    function selectColor(hex) {
      state.onboarding.color = hex;
      render();
    }

    function saveStep2() {
      if (!state.onboarding.habitName.trim()) {
        state.onboarding.habitName = 'Caminar 15 min';
      }
      goToView('onboarding-3');
    }

    function selectAnchor(anchor) {
      state.onboarding.anchorText = anchor;
      render();
    }

    function skipAnchor() {
      state.onboarding.anchorText = '';
      goToView('onboarding-4');
    }

    function nextRevelation(nextStep) {
      state.onboarding.revelationStep = nextStep;
      render();
    }

    function finishOnboarding() {
      state.routine.activeHabit.name = state.onboarding.habitName || 'Mi Hábito Activo';
      state.routine.activeHabit.color = state.onboarding.color;
      state.routine.activeHabit.anchor = state.onboarding.anchorText ? state.onboarding.anchorText : 'Mi rutina diaria';
      state.currentView = 'dashboard';
      render();
    }

    function toggleActiveHabit() {
      const active = state.routine.activeHabit;
      active.completedToday = !active.completedToday;
      if (active.completedToday) {
        confetti({
          particleCount: 50,
          spread: 60,
          origin: { y: 0.8 },
          colors: ['#8FA89B', '#D97D64', '#D6C7A1']
        });
      }
      render();
    }

    function toggleMaintenance(id) {
      const m = state.routine.maintenanceHabits.find(item => item.id === id);
      if (m) {
        m.completedToday = !m.completedToday;
        render();
      }
    }

    function toggleShieldModal() {
      state.showShieldModal = !state.showShieldModal;
      render();
    }

    function confirmShield(useIt) {
      if (useIt && state.routine.activeHabit.shields > 0) {
        state.routine.activeHabit.shields -= 1;
      } else if (!useIt) {
        state.routine.activeHabit.streak = 1;
      }
      state.showShieldModal = false;
      render();
    }

    // Inicializar
    render();
  </script>
</body>
</html>
