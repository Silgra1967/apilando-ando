<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- PWA instalable en pantalla completa (sin Service Worker ni caché offline) -->
    <meta name="theme-color" content="#F7FBF9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Apilando" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height and prevent horizontal overflow/zoom-out on mobile */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #F7FBF9;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        flex: 1;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>Necesitás habilitar JavaScript para usar Apilando Ando.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div
        style="
          display: flex;
          flex: 1;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          background-color: #F7FBF9;
          font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        "
      >
        <img
          src="/icons/icon-192.png"
          alt="Apilando Ando"
          width="96"
          height="96"
          style="width: 96px; height: 96px; object-fit: contain; margin-bottom: 14px;"
        />
        <div
          style="
            font-size: 32px;
            line-height: 38px;
            font-weight: 700;
            letter-spacing: -0.7px;
            color: #121E1C;
            text-align: center;
          "
        >
          Apilando <span style="color: #E85B4A;">Ando</span>
        </div>
      </div>
    </div>
  </body>
</html>
